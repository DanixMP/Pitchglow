<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f10" />
    <title>Recorder</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="heading">
        <p class="eyebrow">Live pitch</p>
        <h1 class="title">My voice</h1>
      </header>

      <section class="stage">
        <canvas id="roll" aria-label="Pitch of your voice drawn over piano-key lanes"></canvas>
      </section>

      <section class="readout" aria-live="polite">
        <span id="note" class="readout-note">–</span>
        <span id="detail" class="readout-detail">Press Start mic and say something</span>
      </section>

      <nav class="controls">
        <button id="mic" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/></svg>
          <span>Start mic</span>
        </button>
        <button id="demo" class="btn" type="button">Demo tone</button>
      </nav>

      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
